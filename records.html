<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกยอดประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F6F3F1;
    --bg-hero:#141414;
    --ink:#1C1C1C;
    --ink-soft:#6B6560;
    --accent:#D81E3A;
    --accent-deep:#A3122A;
    --rust:#6E0F1A;
    --surface:#FFFFFF;
    --line:#E6DFDA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-page);color:var(--ink);font-family:'Sarabun',sans-serif;line-height:1.6;}
  h1,h2,.display{font-family:'Prompt',sans-serif;margin:0;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;}
  .hero{background:var(--bg-hero);color:#F5F1E6;padding:28px 16px 22px;border-bottom:4px solid var(--accent);}
  .hero-inner{max-width:640px;margin:0 auto;}
  .shop-name{font-size:20px;font-weight:700;}
  .tagline{font-size:13px;color:#B5A6A6;margin-top:4px;}

  .section{margin-top:20px;}
  .section-title{font-size:15px;font-weight:600;margin-bottom:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text],input[type=number],input[type=time],input[type=date],select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:'Sarabun',sans-serif;font-size:15px;background:#FCFAF5;
  }
  .field{margin-bottom:10px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checks{display:flex;gap:16px;margin:8px 0;}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
  .checks input{width:auto;}
  .net-line{font-family:'Prompt',sans-serif;font-size:13px;font-weight:600;color:var(--accent-deep);margin-bottom:10px;}

  .row-card{position:relative;}
  .row-num{font-family:'Prompt',sans-serif;font-weight:700;font-size:14px;color:var(--accent-deep);margin-bottom:8px;}
  .remove-btn{
    position:absolute;top:12px;right:12px;background:none;border:none;
    color:var(--ink-soft);font-size:13px;text-decoration:underline;cursor:pointer;
  }

  .btn{font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;border:none;border-radius:8px;
    padding:12px 18px;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.9;}
  .btn-primary{background:var(--accent-deep);color:#fff;}
  .btn-secondary{background:transparent;color:var(--ink-soft);border:1px dashed var(--line);}
  .btn-block{width:100%;}

  .summary-card{background:var(--bg-hero);color:#F5F1E6;border-radius:12px;padding:16px;margin-top:16px;}
  .summary-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;}
  .summary-row.total{font-family:'Prompt',sans-serif;font-weight:700;font-size:19px;color:#FFD400;border-top:1px solid #3A2426;margin-top:6px;padding-top:10px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-hero);color:#F5F1E6;
    padding:12px 20px;border-radius:8px;font-size:14px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="shop-name">บันทึกยอดประจำวัน</div>
    <div class="tagline">กรอกเองแทนการถ่ายรูป — สำหรับช่าง/พนักงาน</div>
  </div>
</div>

<div class="wrap">

  <div class="section">
    <div class="row-2">
      <div class="field">
        <label for="recordDate">วันที่</label>
        <input type="date" id="recordDate">
      </div>
      <div class="field">
        <label for="recordBarber">ช่างเริ่มต้น (เติมอัตโนมัติทุกแถวใหม่)</label>
        <input type="text" id="recordBarber" placeholder="เช่น สมชาย">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">รายการลูกค้า</div>
    <div id="rowsContainer"></div>
    <button class="btn btn-secondary btn-block" onclick="addRow()">+ เพิ่มรายการลูกค้า</button>
  </div>

  <div class="summary-card">
    <div class="summary-row"><span>จำนวนลูกค้า</span><span id="sumCount">0 หัว</span></div>
    <div class="summary-row"><span>โอน</span><span id="sumTransfer">0 บาท</span></div>
    <div class="summary-row"><span>เงินสด</span><span id="sumCash">0 บาท</span></div>
    <div class="summary-row total"><span>ยอดรวม</span><span id="sumTotal">0 บาท</span></div>
  </div>

  <div class="section">
    <button class="btn btn-primary btn-block" onclick="submitRecords()">บันทึกยอดวันนี้</button>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby126dqqPNVll4xsqa4GHA0YZ-k1qaujo14d2RhU8U7hen5bgxxVCpLJoiLiZNdVtzD/exec";

let rowCount = 0;

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

function addRow(prefill){
  rowCount++;
  const id = 'row' + rowCount;
  const div = document.createElement('div');
  div.className = 'card row-card';
  div.id = id;
  div.innerHTML = `
    <button class="remove-btn" onclick="removeRow('${id}')">ลบ</button>
    <div class="row-num">ลำดับที่ ${rowCount}</div>
    <div class="row-2">
      <div class="field">
        <label>ราคา</label>
        <select class="f-price">
          <option value="">-- เลือกราคา --</option>
          <option value="150">150</option>
          <option value="120">120 (ส่วนลดรีวิว)</option>
        </select>
      </div>
      <div class="field">
        <label>วิธีจ่าย</label>
        <select class="f-payment">
          <option value="โอน">โอน</option>
          <option value="เงินสด">เงินสด</option>
        </select>
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" class="f-review"> ส่วนลดรีวิว</label>
      <label><input type="checkbox" class="f-free"> 5 ฟรี 1 (แลกฟรี)</label>
    </div>
    <div class="net-line">ราคาสุทธิ: <span class="net-amount">0 บาท</span></div>
    <div class="row-2">
      <div class="field">
        <label>ช่าง</label>
        <input type="text" class="f-barber" placeholder="เช่น สมชาย">
      </div>
      <div class="field">
        <label>ทรงผม</label>
        <input type="text" class="f-hairstyle" placeholder="เช่น อันเดอร์คัต, ทรงเกรียน">
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>เวลาเริ่ม</label>
        <input type="text" class="f-start" placeholder="เช่น 14:30">
      </div>
      <div class="field">
        <label>เวลาสิ้นสุด</label>
        <input type="text" class="f-end" placeholder="เช่น 15:10">
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" class="f-shave"> Shave (+50 บาท)</label>
      <label><input type="checkbox" class="f-shampoo"> Shampoo (+50 บาท)</label>
    </div>
    <div class="field">
      <label>หมายเหตุ</label>
      <input type="text" class="f-note" placeholder="เช่น ชื่อย่อช่าง">
    </div>
  `;
  document.getElementById('rowsContainer').appendChild(div);

  // เติมชื่อช่างเริ่มต้นให้อัตโนมัติจากช่อง "ช่างเริ่มต้น" ด้านบน (แก้ไขเป็นรายแถวได้เสมอ)
  div.querySelector('.f-barber').value = document.getElementById('recordBarber').value.trim();

  const priceSelect = div.querySelector('.f-price');
  const paymentSelect = div.querySelector('.f-payment');
  const reviewBox = div.querySelector('.f-review');
  const freeBox = div.querySelector('.f-free');
  const shaveBox = div.querySelector('.f-shave');
  const shampooBox = div.querySelector('.f-shampoo');
  const netEl = div.querySelector('.net-amount');

  function refreshNet(){
    netEl.textContent = computeNet_(div).toLocaleString() + ' บาท';
    updateSummary();
  }

  // เลือกราคา 120 (ส่วนลดรีวิว) แล้วติ๊กช่อง "ส่วนลดรีวิว" ให้อัตโนมัติ, เลือก 150 แล้วเอาติ๊กออกให้
  priceSelect.addEventListener('change', function(){
    if (priceSelect.value === '120') reviewBox.checked = true;
    else if (priceSelect.value === '150') reviewBox.checked = false;
    refreshNet();
  });

  // ติ๊ก "5 ฟรี 1" แล้วปิดช่องราคา/วิธีจ่าย/ส่วนลดรีวิวไป เพราะไม่เก็บเงิน แต่ยังนับเป็นลูกค้า 1 คน
  freeBox.addEventListener('change', function(){
    const isFree = freeBox.checked;
    priceSelect.disabled = isFree;
    paymentSelect.disabled = isFree;
    reviewBox.disabled = isFree;
    if (isFree){
      priceSelect.value = '';
      reviewBox.checked = false;
    }
    refreshNet();
  });

  reviewBox.addEventListener('change', refreshNet);
  paymentSelect.addEventListener('change', refreshNet);
  shaveBox.addEventListener('change', refreshNet);
  shampooBox.addEventListener('change', refreshNet);

  refreshNet();
}

// ราคาสุทธิของแถวนั้น = ราคาที่เลือก + Shave/Shampoo (50 ต่ออย่าง) — ถ้าติ๊ก "5 ฟรี 1" ให้เป็น 0 เสมอ
function computeNet_(card){
  if (card.querySelector('.f-free').checked) return 0;
  const base = Number(card.querySelector('.f-price').value) || 0;
  const shave = card.querySelector('.f-shave').checked ? 50 : 0;
  const shampoo = card.querySelector('.f-shampoo').checked ? 50 : 0;
  return base + shave + shampoo;
}

// แถวนี้นับเป็นลูกค้า 1 คนมั้ย — นับถ้าเลือกราคาแล้ว หรือติ๊ก "5 ฟรี 1" (ฟรีก็ยังนับเป็นลูกค้า)
function isCustomerRow_(card){
  if (card.querySelector('.f-free').checked) return true;
  return (Number(card.querySelector('.f-price').value) || 0) > 0;
}

function removeRow(id){
  const el = document.getElementById(id);
  if (el) el.remove();
  renumberRows();
  updateSummary();
}

function renumberRows(){
  const cards = document.querySelectorAll('.row-card');
  cards.forEach(function(card, i){
    card.querySelector('.row-num').textContent = 'ลำดับที่ ' + (i + 1);
  });
}

function updateSummary(){
  const cards = document.querySelectorAll('.row-card');
  let count = 0, total = 0, transfer = 0, cash = 0;
  cards.forEach(function(card){
    if (!isCustomerRow_(card)) return;
    count++;
    const net = computeNet_(card);
    total += net;
    const payment = card.querySelector('.f-payment').value;
    if (payment === 'โอน') transfer += net;
    else if (payment === 'เงินสด') cash += net;
  });
  document.getElementById('sumCount').textContent = count + ' หัว';
  document.getElementById('sumTransfer').textContent = transfer.toLocaleString() + ' บาท';
  document.getElementById('sumCash').textContent = cash.toLocaleString() + ' บาท';
  document.getElementById('sumTotal').textContent = total.toLocaleString() + ' บาท';
}

async function submitRecords(){
  const date = document.getElementById('recordDate').value;
  const barber = document.getElementById('recordBarber').value.trim();
  if (!date){
    showToast('กรุณาเลือกวันที่ก่อน');
    return;
  }
  const cards = document.querySelectorAll('.row-card');
  if (cards.length === 0){
    showToast('กรุณาเพิ่มอย่างน้อย 1 รายการ');
    return;
  }
  const rows = [];
  cards.forEach(function(card, i){
    if (!isCustomerRow_(card)) return; // ข้ามแถวที่ยังไม่ได้เลือกราคาและไม่ได้ติ๊ก 5 ฟรี 1
    rows.push({
      no: i + 1,
      price: computeNet_(card),
      paymentMethod: card.querySelector('.f-free').checked ? '' : card.querySelector('.f-payment').value,
      reviewDiscount: card.querySelector('.f-review').checked,
      freeReward: card.querySelector('.f-free').checked,
      barber: card.querySelector('.f-barber').value.trim(),
      hairstyle: card.querySelector('.f-hairstyle').value.trim(),
      startTime: card.querySelector('.f-start').value || null,
      endTime: card.querySelector('.f-end').value || null,
      shave: card.querySelector('.f-shave').checked,
      shampoo: card.querySelector('.f-shampoo').checked,
      note: card.querySelector('.f-note').value.trim()
    });
  });
  if (rows.length === 0){
    showToast('กรุณาเลือกราคา หรือติ๊ก "5 ฟรี 1" อย่างน้อย 1 รายการ');
    return;
  }

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addRecords', date: date, barber: barber, rows: rows })
    });
    showToast('บันทึกสำเร็จ! ส่งสรุปยอดเข้ากลุ่มไลน์แล้ว');
    document.getElementById('rowsContainer').innerHTML = '';
    rowCount = 0;
    addRow();
  }catch(e){
    showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

// ---------- INIT ----------
document.getElementById('recordDate').value = todayStr();
addRow();
</script>
</body>
</html>
