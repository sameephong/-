<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายรับ-รายจ่ายร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F6F3F1;
    --bg-hero:#141414;
    --ink:#1C1C1C;
    --ink-soft:#6B6560;
    --accent:#D81E3A;
    --accent-deep:#A3122A;
    --green:#1E7A3D;
    --surface:#FFFFFF;
    --line:#E6DFDA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-page);color:var(--ink);font-family:'Sarabun',sans-serif;line-height:1.6;}
  h1,h2,.display{font-family:'Prompt',sans-serif;margin:0;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;}
  .hero{background:var(--bg-hero);color:#F5F1E6;padding:28px 16px 22px;border-bottom:4px solid var(--accent);}
  .hero-inner{max-width:640px;margin:0 auto;}
  .shop-name{font-size:20px;font-weight:700;}
  .tagline{font-size:13px;color:#B5A6A6;margin-top:4px;}

  .section{margin-top:20px;}
  .section-title{font-size:16px;font-weight:600;margin-bottom:10px;font-family:'Prompt',sans-serif;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:'Sarabun',sans-serif;font-size:15px;background:#FCFAF5;
  }
  input[type=file]{width:100%;font-size:13px;}
  .field{margin-bottom:10px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;border:none;border-radius:8px;
    padding:12px 18px;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.9;}
  .btn-primary{background:var(--accent-deep);color:#fff;}
  .btn-secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-block{width:100%;}

  .summary-card{background:var(--bg-hero);color:#F5F1E6;border-radius:12px;padding:18px;margin-top:6px;}
  .summary-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;}
  .summary-row.income span:last-child{color:#5FD87A;font-weight:600;}
  .summary-row.expense span:last-child{color:#FF8A8A;font-weight:600;}
  .summary-row.net{font-family:'Prompt',sans-serif;font-weight:700;font-size:20px;
    border-top:1px solid #3A2426;margin-top:8px;padding-top:12px;}
  .summary-row.net span:last-child{color:#FFD400;}

  .expense-item{display:flex;justify-content:space-between;align-items:flex-start;
    padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .expense-item:last-child{border-bottom:none;}
  .expense-cat{font-family:'Prompt',sans-serif;font-weight:600;font-size:13px;color:var(--accent-deep);}
  .expense-note{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .expense-amount{font-family:'Prompt',sans-serif;font-weight:700;white-space:nowrap;}
  .expense-actions{display:flex;gap:10px;margin-top:4px;}
  .expense-actions a, .expense-actions button{
    font-size:12px;color:var(--ink-soft);text-decoration:underline;background:none;border:none;
    cursor:pointer;padding:0;
  }

  .tab-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
  .tab-btn{flex:0 0 auto;padding:9px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);font-family:'Prompt',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
  .tab-btn.active{background:var(--bg-hero);color:#F5F1E6;border-color:var(--bg-hero);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-hero);color:#F5F1E6;
    padding:12px 20px;border-radius:8px;font-size:14px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .hidden{display:none !important;}

  .pin-screen{max-width:340px;margin:80px auto;padding:0 16px;text-align:center;}
  .pin-screen .card{text-align:left;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="shop-name">รายรับ-รายจ่ายร้าน</div>
    <div class="tagline">สำหรับเจ้าของร้านเท่านั้น</div>
  </div>
</div>

<!-- PIN GATE -->
<div class="pin-screen" id="pinScreen">
  <div class="card">
    <div class="field">
      <label for="pinInput">ใส่รหัส PIN ของร้าน</label>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="••••">
    </div>
    <button class="btn btn-primary btn-block" onclick="checkPin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="wrap hidden" id="mainContent">

  <div class="section">
    <div class="row-2">
      <div class="field">
        <label for="monthPicker">ประจำเดือน</label>
        <input type="month" id="monthPicker">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn btn-secondary btn-block" onclick="loadSummary()">รีเฟรชข้อมูลล่าสุด</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);">* รายได้จะนับเฉพาะวันที่ช่างกด "ปิดยอดประจำวัน" แล้วเท่านั้น</div>
  </div>

  <div class="summary-card">
    <div class="summary-row income"><span>รายได้จากยอดตัดผม</span><span id="sumRevenue">0 บาท</span></div>
    <div class="summary-row expense"><span>รายจ่ายรวม</span><span id="sumExpense">0 บาท</span></div>
    <div class="summary-row net"><span>รายได้สุทธิ</span><span id="sumNet">0 บาท</span></div>
  </div>

  <div class="section">
    <div class="section-title">เพิ่มรายจ่าย</div>
    <div class="tab-row" id="expenseTabs">
      <button class="tab-btn active" data-cat="ค่าเช่า">ค่าเช่า</button>
      <button class="tab-btn" data-cat="ค่าน้ำ">ค่าน้ำ</button>
      <button class="tab-btn" data-cat="ค่าไฟ">ค่าไฟ</button>
      <button class="tab-btn" data-cat="ค่าจ้างช่าง">ค่าจ้างช่าง</button>
      <button class="tab-btn" data-cat="อื่นๆ">อื่นๆ</button>
    </div>

    <div class="card">
      <div class="row-2">
        <div class="field">
          <label for="expAmount">จำนวนเงิน (บาท)</label>
          <input type="number" id="expAmount" inputmode="numeric" placeholder="0">
        </div>
        <div class="field">
          <label for="expDate">วันที่จ่าย</label>
          <input type="date" id="expDate">
        </div>
      </div>
      <div class="field hidden" id="staffNameField">
        <label for="expStaffName">ชื่อช่าง</label>
        <input type="text" id="expStaffName" placeholder="เช่น สมชาย">
      </div>
      <div class="field hidden" id="otherNoteField">
        <label for="expOtherNote">รายละเอียด</label>
        <input type="text" id="expOtherNote" placeholder="เช่น ซื้ออุปกรณ์ตัดผม">
      </div>
      <div class="field">
        <label for="expFile">แนบสลิปโอนเงิน / เอกสาร (ถ้ามี)</label>
        <input type="file" id="expFile" accept="image/*,application/pdf">
      </div>
      <button class="btn btn-primary btn-block" onclick="submitExpense()">บันทึกรายจ่าย</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">รายการรายจ่ายเดือนนี้</div>
    <div class="card" id="expenseList">
      <div style="color:var(--ink-soft);font-size:14px;">กำลังโหลด...</div>
    </div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby126dqqPNVll4xsqa4GHA0YZ-k1qaujo14d2RhU8U7hen5bgxxVCpLJoiLiZNdVtzD/exec";

let currentCategory = 'ค่าเช่า';

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

// ---------- PIN GATE ----------
async function checkPin(){
  const val = document.getElementById('pinInput').value.trim();
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?key=settings');
    const data = await res.json();
    const settings = data.value ? JSON.parse(data.value) : {};
    const correctPin = settings.pin || '1234';
    if (val === correctPin){
      document.getElementById('pinScreen').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      initMainContent();
    }else{
      showToast('รหัส PIN ไม่ถูกต้อง');
    }
  }catch(e){
    showToast('เชื่อมต่อระบบไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

// ---------- TAB SWITCH ----------
document.getElementById('expenseTabs').addEventListener('click', function(e){
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = btn.dataset.cat;
  document.getElementById('staffNameField').classList.toggle('hidden', currentCategory !== 'ค่าจ้างช่าง');
  document.getElementById('otherNoteField').classList.toggle('hidden', currentCategory !== 'อื่นๆ');
});

// ---------- FILE -> BASE64 ----------
function fileToBase64_(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- SUBMIT EXPENSE ----------
async function submitExpense(){
  const amount = Number(document.getElementById('expAmount').value) || 0;
  const date = document.getElementById('expDate').value;
  if (amount <= 0){ showToast('กรุณากรอกจำนวนเงิน'); return; }
  if (!date){ showToast('กรุณาเลือกวันที่'); return; }

  let note = '';
  if (currentCategory === 'ค่าจ้างช่าง'){
    note = document.getElementById('expStaffName').value.trim();
    if (!note){ showToast('กรุณากรอกชื่อช่าง'); return; }
  } else if (currentCategory === 'อื่นๆ'){
    note = document.getElementById('expOtherNote').value.trim();
    if (!note){ showToast('กรุณากรอกรายละเอียด'); return; }
  }

  const payload = { action: 'addExpense', category: currentCategory, amount: amount, date: date, note: note };

  const fileInput = document.getElementById('expFile');
  if (fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    payload.fileBase64 = await fileToBase64_(file);
    payload.fileMimeType = file.type;
    payload.fileName = file.name;
  }

  showToast('กำลังบันทึก...');
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    showToast('บันทึกรายจ่ายสำเร็จ');
    document.getElementById('expAmount').value = '';
    document.getElementById('expFile').value = '';
    document.getElementById('expStaffName').value = '';
    document.getElementById('expOtherNote').value = '';
    loadSummary();
  }catch(e){
    showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

// ---------- DELETE EXPENSE ----------
async function deleteExpense(id){
  if (!confirm('ลบรายการนี้ใช่มั้ย?')) return;
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteExpense', id: id })
    });
    showToast('ลบรายการแล้ว');
    loadSummary();
  }catch(e){
    showToast('ลบไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

// ---------- LOAD SUMMARY ----------
async function loadSummary(){
  const month = document.getElementById('monthPicker').value;
  const listEl = document.getElementById('expenseList');
  listEl.innerHTML = '<div style="color:var(--ink-soft);font-size:14px;">กำลังโหลด...</div>';

  const [revRes, expRes] = await Promise.all([
    fetch(APPS_SCRIPT_URL + '?action=getRevenue&month=' + month).then(r => r.json()),
    fetch(APPS_SCRIPT_URL + '?action=getExpenses&month=' + month).then(r => r.json())
  ]);

  const revenue = revRes.revenue || 0;
  const expenses = expRes.expenses || [];
  const totalExpense = expenses.reduce(function(s, x){ return s + (Number(x.amount) || 0); }, 0);
  const net = revenue - totalExpense;

  document.getElementById('sumRevenue').textContent = revenue.toLocaleString() + ' บาท';
  document.getElementById('sumExpense').textContent = totalExpense.toLocaleString() + ' บาท';
  document.getElementById('sumNet').textContent = net.toLocaleString() + ' บาท';

  if (expenses.length === 0){
    listEl.innerHTML = '<div style="color:var(--ink-soft);font-size:14px;">ยังไม่มีรายจ่ายในเดือนนี้</div>';
    return;
  }
  listEl.innerHTML = '';
  expenses.forEach(function(x){
    const item = document.createElement('div');
    item.className = 'expense-item';
    const fileLink = x.fileUrl ? `<a href="${x.fileUrl}" target="_blank">ดูไฟล์แนบ</a>` : '';
    item.innerHTML = `
      <div>
        <div class="expense-cat">${x.category} · ${x.date}</div>
        ${x.note ? `<div class="expense-note">${x.note}</div>` : ''}
        <div class="expense-actions">
          ${fileLink}
          <button onclick="deleteExpense('${x.id}')">ลบ</button>
        </div>
      </div>
      <div class="expense-amount">${Number(x.amount).toLocaleString()} บาท</div>
    `;
    listEl.appendChild(item);
  });
}

function initMainContent(){
  document.getElementById('expDate').value = todayStr();
  document.getElementById('monthPicker').value = currentMonthStr();
  document.getElementById('monthPicker').addEventListener('change', loadSummary);
  loadSummary();
}
</script>
</body>
</html>
